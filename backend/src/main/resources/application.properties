spring.application.name=reflowtask

# Dev unless told otherwise, so `mvnw spring-boot:run` just works.
spring.profiles.default=dev

# Flyway owns the schema. Hibernate only checks that the entities match it, and
# fails fast on startup if they have drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# How often the reflow job looks for missed blocks. Hourly, on the hour.
reflowtask.reflow.cron=0 0 * * * *
