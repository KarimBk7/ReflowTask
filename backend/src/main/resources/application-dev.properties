# File-based H2 rather than in-memory, so a dev schedule survives a restart and the
# reflow job has real history to act on. ./data/ is gitignored.
spring.datasource.url=jdbc:h2:file:./data/reflowtask-dev;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
