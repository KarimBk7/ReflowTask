# In-memory H2 per test run, migrated by Flyway so tests exercise the real schema.
spring.datasource.url=jdbc:h2:mem:reflowtask-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The reflow job must not fire on its own during tests; they invoke it directly
# with a controlled clock.
reflowtask.reflow.cron=-
